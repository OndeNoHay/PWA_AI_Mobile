<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#1e3a8a" rx="80"/>

  <!-- AI Brain Icon -->
  <g transform="translate(256, 256)">
    <!-- Central circle -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="#3b82f6" stroke-width="8"/>

    <!-- Neural network nodes -->
    <circle cx="-60" cy="-60" r="20" fill="#06b6d4"/>
    <circle cx="60" cy="-60" r="20" fill="#06b6d4"/>
    <circle cx="-60" cy="60" r="20" fill="#06b6d4"/>
    <circle cx="60" cy="60" r="20" fill="#06b6d4"/>
    <circle cx="0" cy="-80" r="20" fill="#06b6d4"/>
    <circle cx="0" cy="80" r="20" fill="#06b6d4"/>
    <circle cx="-80" cy="0" r="20" fill="#06b6d4"/>
    <circle cx="80" cy="0" r="20" fill="#06b6d4"/>

    <!-- Connections -->
    <line x1="-60" y1="-60" x2="0" y2="0" stroke="#3b82f6" stroke-width="3" opacity="0.6"/>
    <line x1="60" y1="-60" x2="0" y2="0" stroke="#3b82f6" stroke-width="3" opacity="0.6"/>
    <line x1="-60" y1="60" x2="0" y2="0" stroke="#3b82f6" stroke-width="3" opacity="0.6"/>
    <line x1="60" y1="60" x2="0" y2="0" stroke="#3b82f6" stroke-width="3" opacity="0.6"/>
    <line x1="0" y1="-80" x2="0" y2="0" stroke="#3b82f6" stroke-width="3" opacity="0.6"/>
    <line x1="0" y1="80" x2="0" y2="0" stroke="#3b82f6" stroke-width="3" opacity="0.6"/>
    <line x1="-80" y1="0" x2="0" y2="0" stroke="#3b82f6" stroke-width="3" opacity="0.6"/>
    <line x1="80" y1="0" x2="0" y2="0" stroke="#3b82f6" stroke-width="3" opacity="0.6"/>

    <!-- Camera icon overlay -->
    <rect x="-30" y="-20" width="60" height="40" rx="5" fill="white" opacity="0.9"/>
    <circle cx="0" cy="0" r="15" fill="#1e3a8a"/>
    <circle cx="0" cy="0" r="10" fill="#06b6d4"/>
  </g>
</svg>
